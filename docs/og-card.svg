<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Mavframe MAVLink packet inspection preview</title>
  <desc id="desc">A synthetic ATTITUDE packet with received CRC A4FE and C parser computed CRC 66D8, identified as a checksum failure.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#38bdf8" stroke-opacity=".11" stroke-width="1"/></pattern>
    <linearGradient id="glow" x1="0" x2="1"><stop stop-color="#0284c7" stop-opacity=".55"/><stop offset="1" stop-color="#0f172a" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="140" cy="400" rx="430" ry="260" fill="url(#glow)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="74" y="96" fill="#38bdf8" font-size="20" font-weight="700" letter-spacing="5">MAVFRAME  /  PACKET INSPECTION</text>
    <text x="72" y="190" fill="#f8fafc" font-size="66" font-weight="700">Trace a signal</text>
    <text x="72" y="268" fill="#f8fafc" font-size="66" font-weight="700">from frame to byte.</text>
    <text x="76" y="325" fill="#cbd5e1" font-size="24">Local MAVLink v1/v2 capture analysis · free in your browser</text>
    <g opacity=".75" fill="#38bdf8" font-family="monospace" font-size="16">
      <text x="78" y="410">fe 1c 00 2b 01 01 1e 00 00 00  ...</text>
      <text x="78" y="444">fd 1c 00 2b 01 01 1e 00 00 00  ...</text>
      <text x="78" y="478">30 00 00 00 00 00 00 00  ...</text>
    </g>
  </g>
  <g filter="url(#shadow)" transform="translate(708 126)">
    <rect width="420" height="382" rx="16" fill="#111f35" stroke="#38bdf8" stroke-opacity=".6"/>
    <path d="M16 0h388a16 16 0 0 1 16 16v58H0V16A16 16 0 0 1 16 0" fill="#123658"/>
    <text x="26" y="44" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="19" font-weight="700">Frame 311 · ATTITUDE · CRC failed</text>
    <text x="26" y="115" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">CAPTURE OFFSET</text>
    <text x="26" y="149" fill="#f8fafc" font-family="monospace" font-size="24">13,866 bytes</text>
    <line x1="24" y1="174" x2="396" y2="174" stroke="#334155"/>
    <text x="26" y="212" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">CRC RECEIVED</text>
    <text x="26" y="247" fill="#fda4af" font-family="monospace" font-size="27">0xA4FE</text>
    <text x="213" y="212" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">C / WASM COMPUTED</text>
    <text x="213" y="247" fill="#7dd3fc" font-family="monospace" font-size="27">0x66D8</text>
    <rect x="26" y="281" width="368" height="1" fill="#334155"/>
    <text x="26" y="320" fill="#38bdf8" font-family="Arial, sans-serif" font-size="16" font-weight="700">Synthetic fixture · CRC is not authentication</text>
    <text x="26" y="350" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14">Parser evidence, not a live radio or verified signature</text>
  </g>
  <text x="76" y="584" fill="#94a3b8" font-family="monospace" font-size="15">MAVLink v1 / v2  ·  local files stay on this device</text>
</svg>
