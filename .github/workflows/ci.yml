name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: pip install -r requirements-dev.txt
      - name: Build (warnings are errors)
        run: |
          CC=${{ matrix.cc }} cmake -S . -B build
          cmake --build build
      - name: C unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Generated CRC_EXTRA table is up to date
        run: python3 tools/gen_crc_extra.py | diff - src/mavframe_crc_extra_common.h
      - name: Differential tests against pymavlink
        run: python3 -m pytest tests -v

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: pip install -r requirements-dev.txt
      - name: Build with ASan + UBSan
        run: |
          CC=gcc cmake -S . -B build-asan -DMAVFRAME_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-asan
      - name: C unit tests under ASan + UBSan
        run: ctest --test-dir build-asan --output-on-failure
      - name: Differential tests with the sanitized dump tool
        run: MAVFRAME_DUMP=$PWD/build-asan/mavframe-dump python3 -m pytest tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: WebAssembly tests against the sanitized native builds (glue and dump tool)
        run: MAVFRAME_DUMP=$PWD/build-asan/mavframe-dump MAVFRAME_GLUE_DUMP=$PWD/build-asan/glue_dump node --test tests/web/test_wasm.mjs

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Make sure the libFuzzer runtime is present
        run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev || true
      - name: Build the libFuzzer target
        run: |
          CC=clang cmake -S . -B build-fuzz -DMAVFRAME_FUZZ=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-fuzz --target fuzz_parse
      - name: Fuzz for 60 seconds
        run: |
          mkdir -p corpus
          ./build-fuzz/fuzz_parse -max_total_time=60 -max_len=2048 corpus fuzz/seeds fuzz/regressions
      - name: Fuzz the WebAssembly glue for 30 seconds
        run: |
          cmake --build build-fuzz --target fuzz_wasm_glue
          mkdir -p corpus-glue
          ./build-fuzz/fuzz_wasm_glue -max_total_time=30 -max_len=2048 corpus-glue fuzz/seeds fuzz/regressions

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install Python tools (pymavlink, zig)
        run: pip install -r requirements-dev.txt ziglang==0.17.1
      - name: Build the native parser (compared against the wasm build)
        run: cmake -S . -B build && cmake --build build
      - name: Committed docs/mavframe.wasm matches a fresh build
        run: |
          sh tools/build_wasm.sh "$RUNNER_TEMP/mavframe.wasm"
          cmp "$RUNNER_TEMP/mavframe.wasm" docs/mavframe.wasm
      - name: Generated message definitions and sample capture are up to date
        run: |
          python3 tools/gen_web_defs.py | diff - docs/js/msgdefs.js
          python3 tools/gen_sample_tlog.py
          git diff --exit-code docs/sample tests/web/sample-truth.json
      - name: Wasm parser tests (Node)
        run: node --test tests/web/test_wasm.mjs
      - name: Browser tests and axe-core gate (Playwright, Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0 axe-core@4.14.0
          npx playwright install --with-deps chromium
          node --test tests/web/test_ui.mjs
